description: >-
  Negative probe record for Addiction Campuses of America. The company was founded in Brentwood,
  TN in 2014 as a residential behavioral-healthcare campus operator and renamed itself Vertava
  Health on 2020-08-01. Three hosts were probed. addictioncampuses.com and www.addictioncampuses.com
  (GoDaddy registration, Domains By Proxy registrant, SiteGround nameservers, renewed through
  2028-06-06) answer EVERY path — including a negative-control path that cannot exist — with an
  identical HTTP 202 SiteGround proof-of-work bot interstitial ("Robot Challenge Screen",
  SHA-1 PoW at /.well-known/sgcaptcha/). Those 202s are challenges, not documents, and the
  path-echo control fails, so every 2xx on those two hosts is discarded. vertavahealth.com — the
  successor brand's host, live WordPress on WP Engine behind Cloudflare — 404s every probed path
  and 301s its own homepage to https://connectionswellnessgroup.com/, an unrelated behavioral-health
  provider. NOT ONE discovery document was retrieved on any host. No WellKnown, SecurityTxt,
  AgentCard, LLMsTxt, APIsJSON or OpenAPI pointer is emitted from this probe, and none should ever
  be emitted from it in a later round.

