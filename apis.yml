aid: addictioncampusesofamerica
name: Addiction Campuses of America
description: >-
  Addiction Campuses of America (EquityZen ticker ACOA) was founded in 2014 in Brentwood,
  Tennessee and owned, operated and managed residential behavioral-healthcare campuses across the
  United States, treating substance use disorder and co-occurring mental health conditions through
  detox, residential, partial-hospitalization and outpatient programs, several of them holding the
  Joint Commission Gold Seal of Approval. Summit Partners invested in the company in 2018, and on
  2020-08-01 it renamed itself Vertava Health. The successor host vertavahealth.com is still a live
  WordPress installation but now 301-redirects its homepage to Connections Wellness Group, an
  unrelated behavioral-health provider, and the original addictioncampuses.com answers every
  request with a SiteGround proof-of-work bot interstitial. This is a clinical services operator,
  not a software vendor: a full contract-discovery pass across all three hosts, the package
  registries, GitHub and 4,000 archived URLs found no developer program, API documentation, SDK or
  machine-readable contract of any kind.
