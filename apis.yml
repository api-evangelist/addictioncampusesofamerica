  HTTP and HTTPS, browser UA and Googlebot UA alike, including a negative-control path that cannot
  exist — with an identical 169-240 byte HTTP 202 SiteGround proof-of-work bot interstitial
  ("Robot Challenge Screen"). Challenges are not evaded, so no page body on that host was read and
  no 2xx from it is treated as a document. It is deliberately NOT wired as a Website pointer. The
  Internet Archive shows the host served its last full-content snapshot on 2020-07-17 and a
  282-byte domain-parking stub redirecting to /lander by 2024-06-24.
